<!DOCTYPE html>
<html>
<head>
    <title>Security Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        .report-btn { padding: 10px 20px; background: #007bff; color: white; text-decoration: none; }
        .report-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Security Dashboard</h1>
        <a href="/security-report" class="report-btn">View Security Report</a>
        <div class="report-section">
            <h3>System Status</h3>
            <p>✅ Security monitoring active</p>
            <p>✅ AI threat detection enabled</p>
            <p>✅ Honeypot system operational</p>
        </div>
    </div>

</html>
